name: Release

# Pousser un tag vX.Y compile le plugin et publie la release GitHub
# avec le jar et le resourcepack.zip que le plugin envoie aux joueurs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Verifier que le tag correspond a la version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas a version=$version dans gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/TastyCroustyPlugin-*.jar
            build/libs/resourcepack.zip
